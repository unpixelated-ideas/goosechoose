<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=app/index.html">
    <title>Open Goose Choose</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #13283d;
        background: #fbf4e8;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #eadfce;
        border-radius: 16px;
        background: #fffdf8;
        box-shadow: 0 18px 45px rgba(29, 45, 67, 0.09);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
      }

      p {
        margin: 0 0 1.25rem;
        color: #627084;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border: 1px solid #d5c7b5;
        border-radius: 8px;
        background: #fff8ed;
        color: #13283d;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Goose Choose</h1>
      <p>If the app does not open automatically, click the button below.</p>
      <a href="app/index.html">Open Goose Choose</a>
    </main>
  </body>
</html>
